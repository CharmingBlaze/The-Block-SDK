name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

# Node 20 is not in the matrix. This repo's packageManager is pnpm@11.7.0, which
# requires Node >=22.13 (it imports node:sqlite). @changesets/cli@3.0.3 and
# dependency-cruiser@18.3.0 also require Node 22. Do not add a Node 20 runner
# and do not lower package engines until those constraints change and a probe
# job using a compatible package manager is green.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:release

  webgl-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum pnpm test:webgl
        env:
          CI: true

  clean-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm clean:dist
      - run: pnpm typecheck
      - run: pnpm examples:typecheck
