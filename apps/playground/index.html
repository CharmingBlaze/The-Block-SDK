<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Block SDK Playground</title>
    <style>
      html, body, #viewport { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #121218; font-family: system-ui, sans-serif; }
      #hud {
        position: absolute; left: 8px; top: 8px; z-index: 2; max-width: min(42rem, calc(100% - 11rem));
        color: #e8e8f0; background: rgba(12, 12, 20, 0.78);
        border: 1px solid #3d3d54; border-radius: 8px;
        padding: 6px 10px; font-size: 12px; line-height: 1.35; pointer-events: none;
      }
      #app-tabs {
        position: absolute; top: 8px; right: 8px;
        z-index: 3; display: flex; gap: 4px; padding: 3px;
        background: rgba(12, 12, 20, 0.82); border: 1px solid #3d3d54; border-radius: 8px;
      }
      #app-tabs button {
        color: #c8c8d8; background: transparent; border: 0; border-radius: 6px;
        padding: 8px 12px; font-size: 13px; cursor: pointer; min-height: 36px;
      }
      #app-tabs button[aria-selected="true"] {
        color: #121218; background: #e8e8f0;
      }
      #spawn-bar {
        position: absolute; left: 8px; bottom: 8px; z-index: 2;
        display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 16px);
      }
      #spawn-bar button, #vertex-panel button {
        color: #e8e8f0; background: rgba(12, 12, 20, 0.82);
        border: 1px solid #3d3d54; border-radius: 6px;
        padding: 8px 10px; font-size: 12px; cursor: pointer; min-height: 36px;
      }
      #spawn-bar button:hover, #vertex-panel button:hover, #app-tabs button:hover { border-color: #7a7ab0; }
      #vertex-panel {
        position: absolute; right: 8px; bottom: 8px; z-index: 3;
        width: min(22rem, calc(100% - 16px));
        display: flex; flex-direction: column; gap: 8px;
        color: #e8e8f0; background: rgba(12, 12, 20, 0.9);
        border: 1px solid #3d3d54; border-radius: 8px; padding: 10px 12px;
        font-size: 12px;
      }
      #vertex-panel[hidden] { display: none; }
      #vertex-panel h2 { margin: 0; font-size: 13px; font-weight: 600; }
      #vertex-cycle { display: flex; align-items: center; gap: 6px; }
      #vertex-cycle button { flex: 0 0 auto; }
      #vertex-index { flex: 1; text-align: center; color: #d8d8e4; font-weight: 600; }
      #vertex-styles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      #vertex-styles button[aria-current="true"] { border-color: #ffc14d; color: #ffc14d; background: #2a2414; }
      #vertex-hint { margin: 0; color: #8b8b98; line-height: 1.4; }
      #spawn-bar.with-markers { max-width: calc(100% - 24rem); }
      @media (max-width: 720px) {
        #hud { top: 52px; max-width: calc(100% - 16px); }
        #app-tabs { left: 8px; right: auto; }
        #vertex-panel { left: 8px; width: auto; }
        #spawn-bar { bottom: auto; top: auto; max-width: calc(100% - 16px); }
      }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
